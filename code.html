<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);

<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Shell Suppression: Login screen represents a focused journey, so global TopNavBar and Footer are omitted per UX goal -->
<main class="w-full max-w-container-max mx-auto grid grid-cols-1 lg:grid-cols-2 gap-0 overflow-hidden rounded-xl shadow-2xl bg-white min-h-[700px]">
<!-- Left Column: Visual Asset -->
<div class="hidden lg:block relative bg-surface-container-lowest overflow-hidden">
<img alt="Figure &amp; Flow Abstract Graphic" class="absolute inset-0 w-full h-full object-cover opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYYryNErjuYdV9udeeCDoqUNeZoHcX8BGfgK7QxmIbXu4dwfYuUKo7rRZ8UX2PEY9PjAVzdqT-lhrC0p_JJcy3IbyLVmg_4o5258XbMg7N38H5qzNwjOJ6XuoRRVryyIugZSJ_tKKQE6t2yg5SxUHH6ggz-lgjypoMhFORFAd1PAE0nso5Gpqr4LMtzj4ybvn3SjyATAGCQgnWRSjouTwu1pkj6xMGGc7BTvCKlTF9fdlVtI2m0cO2qnc5WpzTrcOrRIgqEhb3j_o"/>
<div class="absolute inset-0 bg-gradient-to-tr from-surface/40 to-transparent pointer-events-none"></div>
<!-- Identity watermark for the visual side -->
<div class="absolute bottom-12 left-12">
<p class="font-headline-md text-primary tracking-widest opacity-40 select-none">PRECISION IN MOTION</p>
</div>
</div>
<!-- Right Column: Login Form -->
<div class="flex flex-col justify-center items-center px-8 py-16 lg:px-24 bg-surface relative">
<!-- Form Container -->
<div class="w-full max-w-md space-y-8">
<!-- Header Section -->
<div class="text-center lg:text-left space-y-3">
<h1 class="font-headline-lg text-primary tracking-tight">SkateSync AI</h1>
<p class="font-body-md text-on-surface-variant max-w-sm">
                        Music-aware choreography planner for figure skating and artistic roller skating
                    </p>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-4">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant block" for="email">Email Address</label>
<input class="w-full px-4 py-3 bg-surface-container-highest border border-outline-variant rounded-lg focus:ring-2 focus:ring-tertiary focus:border-tertiary transition-all duration-200 outline-none text-on-surface" id="email" name="email" placeholder="name@skatesync.ai" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-tertiary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-highest border border-outline-variant rounded-lg focus:ring-2 focus:ring-tertiary focus:border-tertiary transition-all duration-200 outline-none text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="space-y-4 pt-2">
<button class="w-full py-4 bg-primary text-on-primary font-headline-md text-body-md rounded-lg hover:bg-slate-800 transition-all duration-300 transform active:scale-[0.98] shadow-lg shadow-primary/10" type="submit">
                            Sign In
                        </button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-on-surface-variant font-label-sm">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full py-4 bg-white border border-outline-variant text-on-surface font-body-md rounded-lg hover:bg-surface-container transition-all duration-300 flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                            Continue with Google
                        </button>
</div>
</form>
<!-- Footer Text -->
<div class="text-center pt-8">
<p class="font-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-tertiary font-bold hover:underline" href="#">Join the roster</a>
</p>
</div>
</div>
<!-- Subtle Decorative Element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-tertiary/5 rounded-bl-full -z-10"></div>
</div>
</main>
<!-- Content-Canvas Separator / Footnote -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 text-on-surface-variant/40 font-label-sm pointer-events-none select-none">
        © 2024 SKATESYNC AI. PRECISION IN MOTION.
    </div>
